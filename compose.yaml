services:
  paperclip-notifier:
    image: ghcr.io/jmengit/paperclip-notifier:v0.4.0
    container_name: paperclip-notifier
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    mem_limit: 128m
    cpus: 0.25
    environment:
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:?set in protected runtime environment}
      PAPERCLIP_ATTENTION_ENABLED: ${PAPERCLIP_ATTENTION_ENABLED:-true}
      PAPERCLIP_ATTENTION_SOURCE_KINDS: ${PAPERCLIP_ATTENTION_SOURCE_KINDS:-}
      PAPERCLIP_ACTIVITY_ENABLED: ${PAPERCLIP_ACTIVITY_ENABLED:-true}
      PAPERCLIP_ACTIVITY_IMMEDIATE_EVENTS: ${PAPERCLIP_ACTIVITY_IMMEDIATE_EVENTS:-}
      PAPERCLIP_ACTIVITY_DIGEST_EVENTS: ${PAPERCLIP_ACTIVITY_DIGEST_EVENTS:-}
      IFTTT_WEBHOOK_URL: ${IFTTT_WEBHOOK_URL:?set in protected runtime environment}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WEBHOOK_EXAMPLE_POST_URL: ${WEBHOOK_EXAMPLE_POST_URL:-}
    volumes:
      - /mnt/user/appdata/paperclip-notifier/data:/data
      - /mnt/user/appdata/paperclip-notifier/config:/config:ro

    ports:
      - "8080:8080"
    networks:
      - paperclip
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=3); assert json.load(r)['ok']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  paperclip:
    external: true
    name: paperclip_default
