[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperclip-notifier"
version = "0.1.0"
description = "Durable Paperclip activity notifier with IFTTT, Discord, Telegram, and generic webhook delivery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jmengit" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
paperclip-notifier = "paperclip_notifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
